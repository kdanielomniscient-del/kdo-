<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.D.O KAL - App Cadeau</title>
<style>
body{margin:0;font-family:system-ui;background:#111B21;color:white}
.header{background:#202C33;padding:15px;display:flex;align-items:center;gap:10px;position:sticky;top:0}
.logo{width:40px;height:40px;background:#00A884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.chat-list{padding:10px}
.chat{background:#202C33;margin-bottom:8px;border-radius:12px;padding:12px;display:flex;gap:12px}
.chat img{width:50px;height:50px;border-radius:50%}
.btn{background:#00A884;color:white;border:none;padding:12px 20px;border-radius:25px;width:100%;font-size:16px;margin-top:15px;font-weight:bold}
.hero{padding:30px 20px;text-align:center}
.hero h1{color:#00A884}
</style>
</head>
<body>
<div class="header"><div class="logo">🎁</div><div><b>K.D.O KAL</b><br><small style="color:#8696A0">App cadeau calme</small></div></div>
<div class="hero">
<h1>Bienvenue dans ton cadeau</h1>
<p style="color:#8696A0">Une appli calme, partagée avec le monde entier. Plus simple et plus rapide que WhatsApp.</p>
<button class="btn" onclick="alert('KDO CALL lancé ! 📞')">📞 LANCER UN APPEL KDO</button>
</div>
<div class="chat-list">
<div class="chat"><img src="https://i.pravatar.cc/100?img=1"><div><b>Maman ❤️</b><br><small>Merci pour le cadeau calme</small></div></div>
<div class="chat"><img src="https://i.pravatar.cc/100?img=2"><div><b>Togo Travail 🇹🇬</b><br><small>Nouvelle offre KDO disponible</small></div></div>
<div class="chat"><img src="https://i.pravatar.cc/100?img=3"><div><b>Amis du Monde 🌍</b><br><small>Partage ton calme</small></div></div>
</div>
</body>
                               </html>
